# ---------------------------------------------------------------------------
# Framework configuration. Every key can be overridden from the command line:
#   mvn test -Dbrowser=firefox -Dheadless=false -Dbase.url=https://pc-qa.mycompany.com/pc/PolicyCenter.do
# base.url=mock  -> runs against the bundled InsureSuite mock (src/test/resources/mockapp)
# ---------------------------------------------------------------------------
base.url=mock
browser=chrome
headless=true
timeout.explicit=10
timeout.pageload=30
window.width=1400
window.height=1000
screenshot.every.step=false
# optional: path to a specific browser binary
chrome.binary=
